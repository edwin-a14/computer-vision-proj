<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Detection</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js" integrity="sha512-q/dWJ3kcmjBLU4Qc47E4A9kTB4m3wuTY7vkFJDTZKjTs8jhyGQnaUrxa0Ytd0ssMZhbNua9hE+E7Qv1j+DyZwA==" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #1e1e1e;
            color: #f0f0f0;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }
        h1 {
            margin: 5px 0;
            font-size: 1rem;
            text-align: center;
            flex-shrink: 0;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 5px;
            padding: 0 10px;
            flex-shrink: 0;
        }
        .video-container {
            display: flex;
            flex: 1;
            width: 100%;
            min-height: 0;
            background: #000;
        }
        .view-box {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #333;
            overflow: hidden;
            min-width: 0;
            min-height: 0;
        }
        .view-box h3 {
            position: absolute;
            top: 10px;
            left: 10px;
            margin: 0;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.9rem;
            z-index: 10;
            pointer-events: none;
        }
        video, img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        
        button {
            background-color: #007acc;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        .hidden { display: none; }

        @media (orientation: landscape) {
            .video-container {
                flex-direction: row;
            }
        }
        @media (orientation: portrait) {
            .video-container {
                flex-direction: column;
            }
        }
        
        @media screen and (orientation: landscape) and (max-height: 600px) {
            h1 { display: none; }
            .controls {
                position: absolute;
                top: 10px;
                right: 10px;
                flex-direction: column;
                margin: 0;
                z-index: 100;
                transition: opacity 0.3s;
            }
            .view-box { border: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Real-time Detection</h1>
        
        <div class="controls">
            <button id="startBtn">Start Camera</button>
            <button id="stopBtn" disabled>Stop Camera</button>
        </div>

        <div class="video-container">
            <div class="view-box">
                <img id="processedImage" src="//:0" alt="Processed Stream">
            </div>
        </div>
        
        <!-- Hidden elements for frame capture -->
        <video id="video" autoplay playsinline class="hidden"></video>
        <canvas id="canvas" width="640" height="480" class="hidden"></canvas>
    </div>

    <script>
        const socket = io();
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const processedImage = document.getElementById('processedImage');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const stats = document.getElementById('stats');
        const ctx = canvas.getContext('2d');

        let stream = null;
        let intervalId = null;
        let isProcessing = false;

        startBtn.addEventListener('click', async () => {
            try {
                const width = window.innerWidth;
                const height = window.innerHeight;
                
                canvas.width = width;
                canvas.height = height;

                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: width }, 
                        height: { ideal: height } 
                    } 
                });
                video.srcObject = stream;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                
                intervalId = setInterval(sendFrame, 100); // 10 FPS
            } catch (err) {
                alert("Could not access webcam. Please ensure you have granted permission.");
            }
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        stopBtn.addEventListener('click', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            if (intervalId) {
                clearInterval(intervalId);
            }
            startBtn.disabled = false;
            stopBtn.disabled = true;
        });

        function sendFrame() {
            if (isProcessing) return;
            isProcessing = true;

            try {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);                
                const imageData = canvas.toDataURL('image/jpeg', 0.8);
                socket.emit('process_frame', { image: imageData });

            } catch (err) {
                console.error("Error processing frame:", err);
                isProcessing = false;
            }
        }

        socket.on('frame_processed', (data) => {
            if (data.image) {
                processedImage.src = data.image;
            }
            isProcessing = false;
        });

        socket.on('error', (data) => {
            console.error("Server error:", data.message);
            isProcessing = false;
        });
    </script>
</body>
</html>
